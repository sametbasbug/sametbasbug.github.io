name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Arka arkaya gelen push'larda yalnızca sonuncusu yayına gitsin.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # package.json node >=22.12 istiyor; 24 ile derliyoruz.
      # Eski kurulumdaki Firebase ve iletişim formu değişkenleri kaldırıldı:
      # yeni sitede ne form var ne de üçüncü taraf servis.
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
