name: Briefing V1 Pipeline

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Tarih (YYYY-MM-DD). Boş bırakılırsa bugünün tarihi kullanılır."
        required: false
        type: string
      run_full:
        description: "Prepare + Draft + Validate + Build çalıştır"
        required: false
        default: false
        type: boolean
      strict:
        description: "Validate adımında strict mod"
        required: false
        default: false
        type: boolean
      auto_pr:
        description: "İçerik değişiklikleri için otomatik PR aç"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve run date
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            RUN_DATE="${{ github.event.inputs.date }}"
          else
            RUN_DATE="$(date +%F)"
          fi
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run prepare only
        if: ${{ github.event.inputs.run_full != 'true' }}
        run: npm run briefing:v1 -- --date "${{ env.RUN_DATE }}"

      - name: Run full pipeline (CI mode)
        id: full
        if: ${{ github.event.inputs.run_full == 'true' }}
        continue-on-error: true
        run: |
          EXTRA_ARGS="--date ${{ env.RUN_DATE }}"
          if [ "${{ github.event.inputs.strict }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --strict"
          fi
          npm run briefing:v1:run:ci -- $EXTRA_ARGS

      - name: Upload briefing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-v1-${{ env.RUN_DATE }}-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            briefing/${{ env.RUN_DATE }}/
            src/content/gunlukOzet/${{ env.RUN_DATE }}-*.md

      - name: Build report summary for PR
        id: report_meta
        if: always()
        shell: bash
        run: |
          REPORT_FILE="briefing/${{ env.RUN_DATE }}/validate-report.md"
          if [ ! -f "$REPORT_FILE" ]; then
            echo "report_result=NO_REPORT" >> "$GITHUB_OUTPUT"
            echo "report_errors=0" >> "$GITHUB_OUTPUT"
            echo "report_warnings=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESULT=$(grep -E '^- result:' "$REPORT_FILE" | head -n1 | awk -F': ' '{print $2}')
          ERRORS=$(grep -o '❌' "$REPORT_FILE" | wc -l | tr -d ' ')
          WARNINGS=$(grep -o '⚠️' "$REPORT_FILE" | wc -l | tr -d ' ')

          echo "report_result=${RESULT:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "report_errors=${ERRORS:-0}" >> "$GITHUB_OUTPUT"
          echo "report_warnings=${WARNINGS:-0}" >> "$GITHUB_OUTPUT"

      - name: Create PR for briefing changes
        if: ${{ github.event.inputs.auto_pr == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: briefing/${{ env.RUN_DATE }}
          commit-message: "chore(briefing): update daily summaries for ${{ env.RUN_DATE }}"
          title: "Briefing update: ${{ env.RUN_DATE }}"
          body: |
            Otomatik briefing güncellemesi.

            - Date: `${{ env.RUN_DATE }}`
            - Run full: `${{ github.event.inputs.run_full }}`
            - Strict: `${{ github.event.inputs.strict }}`

            ## Validate Özeti
            - Result: `${{ steps.report_meta.outputs.report_result }}`
            - Errors: `${{ steps.report_meta.outputs.report_errors }}`
            - Warnings: `${{ steps.report_meta.outputs.report_warnings }}`

            Not: Detaylı rapor artifact içinde `validate-report.md` dosyasında.
          add-paths: |
            briefing/${{ env.RUN_DATE }}/
            src/content/gunlukOzet/${{ env.RUN_DATE }}-*.md

      - name: Fail job if full pipeline failed
        if: ${{ github.event.inputs.run_full == 'true' && steps.full.outcome == 'failure' }}
        run: |
          echo "Full pipeline failed. Check artifact report (validate-report.md)."
          exit 1
